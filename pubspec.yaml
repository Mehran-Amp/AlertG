name: bitcoin_checker
description: "A production-grade, real-time financial market alert application in Flutter."
publish_to: 'none'
version: 3.6.1+34

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  alarmer_native:
    path: plugins/alarmer_native

  # --- 1. State Management ---
  flutter_bloc: 8.1.6
  equatable: 2.0.7

  # --- 2. Local Persistence (JSON file) ---
  path_provider: 2.1.5

  # --- 3. Networking & REST APIs ---
  dio: 5.7.0
  http: 1.2.2

  # --- 4. Local & System Notifications & Cloud Messaging ---
  flutter_local_notifications: 18.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  google_sign_in: ^7.2.0

  # --- 5. Background Execution & Services ---
  flutter_background_service: ^5.1.0

  # --- 6. Platform Permissions (Android 14+ / iOS) ---
  permission_handler: 11.3.1

  # --- 7. Audio & Haptics ---
  audioplayers: 6.1.0

  # --- 8. Core Utilities ---
  intl: 0.20.1
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing & Mocking
  bloc_test: 9.1.7
  mocktail: 1.0.4

  # Code Style & Lints
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true

  # Audio Chimes for Alerts
  assets:
    - assets/sounds/
