<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d28" />
      <stop offset="50%" stop-color="#10131a" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Neon Green Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Neon Red Gradient -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Arc 1 (Coral) Gradient -->
    <linearGradient id="arc1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Arc 2 (Orange) Gradient -->
    <linearGradient id="arc2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Arc 3 (Amber) Gradient -->
    <linearGradient id="arc3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Arc 4 (Gold) Gradient -->
    <linearGradient id="arc4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Center Orb Gradient -->
    <radialGradient id="orbGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowWarm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="22" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Slate Backdrop with Rounded Corner -->
  <rect width="1000" height="1000" rx="200" fill="url(#bgGrad)" />
  <rect width="992" height="992" x="4" y="4" rx="196" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" />

  <!-- ================= RADAR / ALERT WAVES ================= -->
  <g filter="url(#glowWarm)">
    <!-- Arc 4 (Outer Gold) R=304, center=(595, 448) -->
    <path d="M 595 144 A 304 304 0 0 1 899 448" fill="none" stroke="url(#arc4Grad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 595 144 A 304 304 0 0 1 899 448" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" />

    <!-- Arc 3 (Amber) R=228 -->
    <path d="M 595 220 A 228 228 0 0 1 823 448" fill="none" stroke="url(#arc3Grad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 595 220 A 228 228 0 0 1 823 448" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" />

    <!-- Arc 2 (Orange) R=152 -->
    <path d="M 595 296 A 152 152 0 0 1 747 448" fill="none" stroke="url(#arc2Grad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 595 296 A 152 152 0 0 1 747 448" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" />

    <!-- Arc 1 (Coral / Red-Orange) R=78 -->
    <path d="M 595 370 A 78 78 0 0 1 673 448" fill="none" stroke="url(#arc1Grad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 595 370 A 78 78 0 0 1 673 448" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" />

    <!-- Center Glowing Signal Orb -->
    <circle cx="595" cy="448" r="30" fill="url(#orbGrad)" />
    <circle cx="586" cy="439" r="8" fill="#ffffff" fill-opacity="0.75" />
  </g>

  <!-- ================= CANDLESTICKS ================= -->

  <!-- Candle 1: Red (x=135) -->
  <g filter="url(#glowRed)">
    <line x1="135" y1="490" x2="135" y2="545" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" />
    <line x1="135" y1="715" x2="135" y2="770" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" />
    <rect x="103" y="545" width="64" height="170" rx="30" fill="#ff1744" fill-opacity="0.12" stroke="url(#neonRed)" stroke-width="14" />
    <rect x="107" y="549" width="56" height="162" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
  </g>

  <!-- Candle 2: Green (x=232) -->
  <g filter="url(#glowGreen)">
    <line x1="232" y1="370" x2="232" y2="460" stroke="url(#neonGreen)" stroke-width="14" stroke-linecap="round" />
    <line x1="232" y1="670" x2="232" y2="750" stroke="url(#neonGreen)" stroke-width="14" stroke-linecap="round" />
    <rect x="200" y="460" width="64" height="210" rx="30" fill="#00e676" fill-opacity="0.12" stroke="url(#neonGreen)" stroke-width="14" />
    <rect x="204" y="464" width="56" height="202" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
  </g>

  <!-- Candle 3: Green (x=328) -->
  <g filter="url(#glowGreen)">
    <line x1="328" y1="370" x2="328" y2="445" stroke="url(#neonGreen)" stroke-width="14" stroke-linecap="round" />
    <line x1="328" y1="605" x2="328" y2="660" stroke="url(#neonGreen)" stroke-width="14" stroke-linecap="round" />
    <rect x="296" y="445" width="64" height="160" rx="30" fill="#00e676" fill-opacity="0.12" stroke="url(#neonGreen)" stroke-width="14" />
    <rect x="300" y="449" width="56" height="152" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
  </g>

  <!-- Candle 4: Peak Green (x=425) -->
  <g filter="url(#glowGreen)">
    <line x1="425" y1="210" x2="425" y2="310" stroke="url(#neonGreen)" stroke-width="14" stroke-linecap="round" />
    <line x1="425" y1="550" x2="425" y2="615" stroke="url(#neonGreen)" stroke-width="14" stroke-linecap="round" />
    <rect x="393" y="310" width="64" height="240" rx="30" fill="#00e676" fill-opacity="0.12" stroke="url(#neonGreen)" stroke-width="14" />
    <rect x="397" y="314" width="56" height="232" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
  </g>

  <!-- Candle 5: Red (x=518) -->
  <g filter="url(#glowRed)">
    <line x1="518" y1="425" x2="518" y2="542" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" />
    <line x1="518" y1="767" x2="518" y2="820" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" />
    <rect x="486" y="542" width="64" height="225" rx="30" fill="#ff1744" fill-opacity="0.12" stroke="url(#neonRed)" stroke-width="14" />
    <rect x="490" y="546" width="56" height="217" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
  </g>

  <!-- Candle 6: Red (x=612) -->
  <g filter="url(#glowRed)">
    <line x1="612" y1="550" x2="612" y2="620" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" />
    <line x1="612" y1="710" x2="612" y2="780" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" />
    <rect x="580" y="620" width="64" height="90" rx="30" fill="#ff1744" fill-opacity="0.12" stroke="url(#neonRed)" stroke-width="14" />
    <rect x="584" y="624" width="56" height="82" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
  </g>
</svg>
